# Home Assistant app — https://contributors.home-assistant.io/apps/reference/configuration/
name: Portal Met Bridge
version: "0.14.0"
slug: portal_met_bridge
description: Belka Portal conductivity logged against Meticulous espresso shots, served on your LAN; files kept in /share
url: https://github.com/privaterra/portal-met-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Web UI — open it in Chrome or Edge on the computer next to the machine (the browser talks to the Portal and the Meticulous, not the Pi)
webui: http://[HOST]:[PORT:8787]
map:
  - type: share
    read_only: false
options:
  data_dir: /share/portal-met-bridge
  log_level: info
schema:
  data_dir: str
  log_level: list(debug|info|warning|error)
# Uncomment to install the prebuilt multi-arch image published by
# .github/workflows/ha-app.yml instead of building on the device:
# image: ghcr.io/privaterra/portal-met-bridge
