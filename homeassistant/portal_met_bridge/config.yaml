# Home Assistant app — https://contributors.home-assistant.io/apps/reference/configuration/
name: Portal Met Bridge
version: "0.18.0"
slug: portal_met_bridge
description: Meticulous & Belka Portal conductivity data visualization & analysis, served on your LAN; files kept in /share
url: https://github.com/privaterra/portal-met-bridge
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
hassio_api: true # so the page's Stop button can stop this app through the Supervisor
ports:
  8787/tcp: 8787
  8788/tcp: 8788
ports_description:
  8787/tcp: Web UI over http — open it in Chrome or Edge on the computer next to the machine (the browser talks to the Portal and the Meticulous, not the Pi)
  8788/tcp: The same page over https — the address to use for the Portal's Bluetooth (see the Documentation tab)
webui: http://[HOST]:[PORT:8787]
map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true
options:
  data_dir: /share/portal-met-bridge
  ssl: self-signed
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
schema:
  data_dir: str
  ssl: list(self-signed|home-assistant|off)
  certfile: str
  keyfile: str
  log_level: list(debug|info|warning|error)
# Uncomment to install the prebuilt multi-arch image published by
# .github/workflows/ha-app.yml instead of building on the device:
# image: ghcr.io/privaterra/portal-met-bridge
