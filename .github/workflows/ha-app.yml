# Build the Home Assistant app image (homeassistant/portal_met_bridge) for
# aarch64 (Raspberry Pi 5, Home Assistant Green/Yellow) and amd64, and publish it
# to GitHub Container Registry as ghcr.io/<owner>/portal-met-bridge:<version>.
#
# This is optional. Without it the Supervisor builds the app on the device from
# the Dockerfile (a minute or two on a Pi 5). To switch users to the prebuilt
# image: run this workflow once (it runs on every published release too), make
# the package public under github.com/<owner>?tab=packages → portal-met-bridge →
# Package settings → Change visibility, then uncomment `image:` in config.yaml.
# Uses the Home Assistant builder actions: https://github.com/home-assistant/builder
name: Home Assistant app image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (untick to only check that it builds)
        type: boolean
        default: true

env:
  APP_DIR: homeassistant/portal_met_bridge
  IMAGE_NAME: portal-met-bridge

permissions:
  contents: read

jobs:
  prepare:
    name: Read the app's config
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
    steps:
      - uses: actions/checkout@v7
      - name: Version and architectures from config.yaml
        id: info
        run: |
          # yq is preinstalled on the GitHub runners; GHCR wants a lower-case owner
          {
            echo "version=$(yq -r '.version' "$APP_DIR/config.yaml")"
            echo "architectures=$(yq -o=json -I=0 '.arch' "$APP_DIR/config.yaml")"
            echo "registry_prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=Portal Met Bridge
            io.hass.description=Meticulous & Belka Portal conductivity data visualization & analysis
            io.hass.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          push: ${{ github.event_name == 'release' || inputs.push }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish the multi-arch manifest
    needs: [prepare, build]
    if: github.event_name == 'release' || inputs.push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
